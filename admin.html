<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin | ROBLOX DEV</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070a11;
  color:white;
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.card{
  background:#0d1320;
  border:1px solid #202a3a;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}

h1{
  font-size:25px;
}

h2{
  margin-bottom:15px;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tab{
  border:1px solid #29364c;
  background:#141c2b;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:#2563eb;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  color:#aab4c5;
  font-size:13px;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  background:#080d17;
  border:1px solid #2a3548;
  color:white;
  border-radius:10px;
  padding:12px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  cursor:pointer;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  color:white;
}

.primary{
  background:#2563eb;
}

.success{
  background:#16a34a;
}

.danger{
  background:#dc2626;
}

.gray{
  background:#374151;
}

.preview{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:15px;
}

.preview img,
.preview video{
  width:220px;
  max-height:160px;
  object-fit:contain;
  background:#000;
  border-radius:10px;
}

.item{
  background:#0a101b;
  border:1px solid #273348;
  border-radius:13px;
  padding:15px;
  margin-top:12px;
}

.item h3{
  margin-bottom:8px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  background:#1d4ed8;
  border-radius:20px;
  font-size:11px;
  margin:3px;
}

.muted{
  color:#98a4b7;
  font-size:13px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.status{
  background:#111827;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

@media(max-width:700px){
  body{
    padding:10px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  header{
    align-items:flex-start;
    gap:10px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

<div>
<h1>ROBLOX DEV — ADMIN</h1>
<p class="muted">
ระบบจัดการสินค้า / คลิป / สิทธิ์การเรียน
</p>
</div>

<button id="logoutBtn" class="btn gray">
ออกจากระบบ
</button>

</header>


<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>เข้าสู่ระบบแอดมิน</h2>

<button id="loginBtn" class="btn primary">
เข้าสู่ระบบด้วย Google
</button>

</div>


<!-- ADMIN -->

<div id="adminPanel" style="display:none">

<div id="statusBox" class="status">
กำลังโหลด...
</div>


<!-- TABS -->

<div class="tabs">

<button class="tab active" data-target="productsSection">
สินค้า
</button>

<button class="tab" data-target="videosSection">
คลิป
</button>

<button class="tab" data-target="requestsSection">
ผู้ขอสิทธิ์เรียน
</button>

</div>


<!-- =================สินค้า================ -->

<div id="productsSection" class="section active">

<div class="card">

<h2>เพิ่มสินค้า</h2>

<div class="grid">


<div>

<label>ชื่อสินค้า *</label>

<input
id="productTitle"
placeholder="ชื่อสินค้า">

</div>


<div>

<label>ราคา *</label>

<input
id="productPrice"
type="number"
min="0"
placeholder="เช่น 99">

</div>


<div>

<label>หมวดหมู่สินค้า *</label>

<input
id="productCategory"
list="categoryList"
placeholder="เช่น แมพ / UI / โมเดล">

<datalist id="categoryList"></datalist>

</div>


<div>

<label>เลือกหมวดหมู่เดิม</label>

<select id="categorySelect">

<option value="">
-- เลือกหมวดหมู่ --
</option>

</select>

</div>


<div class="full">

<label>รายละเอียดสินค้า</label>

<textarea
id="productDescription"
placeholder="รายละเอียดสินค้า">
</textarea>

</div>


<!-- รูป -->

<div>

<label>
รูปสินค้า
เลือกจากเครื่อง
</label>

<input
id="imageFile"
type="file"
accept="image/*">

</div>


<div>

<label>
หรือ URL รูป
</label>

<input
id="imageUrl"
placeholder="https://...">

</div>


<!-- VIDEO -->

<div>

<label>
วิดีโอสินค้า
เลือกจากเครื่อง
</label>

<input
id="productVideoFile"
type="file"
accept="video/*">

</div>


<div>

<label>
หรือ URL วิดีโอ
</label>

<input
id="productVideoUrl"
placeholder="https://...">
</div>


<!-- MODEL -->

<div>

<label>
โมเดล 3D
เลือกไฟล์ .glb
</label>

<input
id="modelFile"
type="file"
accept=".glb,model/gltf-binary">

</div>


<div>

<label>
หรือ URL โมเดล .glb
</label>

<input
id="modelUrl"
placeholder="https://.../model.glb">

</div>


<!-- ติดต่อ -->

<div>

<label>
LINE
ไม่จำเป็นต้องใส่
</label>

<input
id="lineLink"
placeholder="ลิงก์ LINE">

</div>


<div>

<label>
Facebook
ไม่จำเป็นต้องใส่
</label>

<input
id="facebookLink"
placeholder="ลิงก์ Facebook">

</div>


<div>

<label>
Discord
ไม่จำเป็นต้องใส่
</label>

<input
id="discordLink"
placeholder="ลิงก์ Discord">

</div>

</div>


<div
id="productPreview"
class="preview">
</div>


<br>

<button
id="addProductBtn"
class="btn primary">

+ เพิ่มสินค้า

</button>

</div>


<!-- รายการสินค้า -->

<div class="card">

<h2>
สินค้าทั้งหมด
</h2>

<div id="productList">
กำลังโหลด...
</div>

</div>

</div>



<!-- =================คลิป================ -->

<div id="videosSection" class="section">

<div class="card">

<h2>
เพิ่มคลิป
</h2>


<div class="grid">


<div>

<label>
ชื่อคลิป *
</label>

<input
id="videoTitle"
placeholder="ชื่อคลิป">

</div>


<div>

<label>
หมวดหมู่คลิป
</label>

<select id="videoCategory">

<option value="คลิปโปรโมทสินค้า">
คลิปโปรโมทสินค้า
</option>

<option value="สื่อการสอน">
สื่อการสอน
</option>

<option value="คลิปทั่วไป">
คลิปทั่วไป
</option>

</select>

</div>


<div>

<label>
สินค้า
ใช้เมื่อเป็นคลิปโปรโมท
</label>

<select id="videoProduct">

<option value="">
-- ไม่ผูกสินค้า --
</option>

</select>

</div>


<div>

<label>
ราคาโปรโมท
</label>

<input
id="videoPrice"
type="number"
min="0">

</div>


<div class="full">

<label>
รายละเอียดคลิป
</label>

<textarea
id="videoDescription">
</textarea>

</div>


<div>

<label>
วิดีโอจากเครื่อง
</label>

<input
id="videoFile"
type="file"
accept="video/*">

</div>


<div>

<label>
หรือ URL วิดีโอ
</label>

<input
id="videoUrl"
placeholder="https://...">

</div>


<div>

<label>
รูปปกจากเครื่อง
ไม่จำเป็น
</label>

<input
id="videoCoverFile"
type="file"
accept="image/*">

</div>


<div>

<label>
หรือ URL รูปปก
</label>

<input
id="videoCoverUrl"
placeholder="https://...">

</div>

</div>


<div
id="videoPreview"
class="preview">
</div>


<br>

<button
id="addVideoBtn"
class="btn primary">

+ เพิ่มคลิป

</button>

</div>


<div class="card">

<h2>
คลิปทั้งหมด
</h2>

<div id="videoList">
กำลังโหลด...
</div>

</div>

</div>



<!-- ================= REQUEST ================= -->

<div id="requestsSection" class="section">

<div class="card">

<h2>
จัดการสิทธิ์การเรียน
</h2>

<p class="muted">

กด "ระงับ" เพื่อบล็อก Gmail
ไม่ให้เข้าเรียน

การระงับจะไม่ลบบัญชี Google

</p>


<div id="requestList">

กำลังโหลด...

</div>

</div>

</div>

</div>

</div>



<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
doc,
deleteDoc,
updateDoc,
serverTimestamp,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";


import {
firebaseConfig,
ADMIN_EMAIL
}
from "./firebase-config.js";


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const storage =
getStorage(app);


const provider =
new GoogleAuthProvider();


const $ =
id =>
document.getElementById(id);


let products = [];

let categories = new Set();

let videos = {

productVideos:[],
videos:[],
generalVideos:[]

};



/* ================= LOGIN ================= */


$("loginBtn").onclick =
async()=>{

try{

await signInWithPopup(
auth,
provider
);

}catch(error){

alert(
"เข้าสู่ระบบไม่สำเร็จ\n"+
error.message
);

}

};


$("logoutBtn").onclick =
()=>signOut(auth);



onAuthStateChanged(
auth,
user=>{

if(!user){

$("loginBox").style.display =
"block";

$("adminPanel").style.display =
"none";

return;

}


if(
(user.email||"").toLowerCase()
!==
ADMIN_EMAIL.toLowerCase()
){

alert(
"บัญชีนี้ไม่มีสิทธิ์เข้า Admin"
);

signOut(auth);

return;

}


$("loginBox").style.display =
"none";

$("adminPanel").style.display =
"block";

$("statusBox").textContent =
"เข้าสู่ระบบแอดมิน: "
+
user.email;


loadProducts();

loadVideos();

loadRequests();

});



/* ================= TABS ================= */


document
.querySelectorAll(".tab")
.forEach(button=>{

button.onclick=()=>{

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

document
.querySelectorAll(".section")
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

$(
button.dataset.target
)
.classList.add("active");

};

});



/* ================= UPLOAD ================= */


async function uploadFile(
file,
folder
){

if(!file)
return "";


const safeName =
file.name
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const storageRef =
ref(
storage,
folder+
"/"+
Date.now()+
"_"+
safeName
);


await uploadBytes(
storageRef,
file
);


return await
getDownloadURL(
storageRef
);

}



/* ================= PREVIEW PRODUCT ================= */


function updateProductPreview(){

const box =
$("productPreview");

box.innerHTML="";


const image =
$("imageFile")
.files[0];


const video =
$("productVideoFile")
.files[0];


if(image){

const img =
document.createElement("img");

img.src =
URL.createObjectURL(
image
);

box.appendChild(img);

}


if(video){

const v =
document.createElement("video");

v.src =
URL.createObjectURL(
video
);

v.controls=true;

box.appendChild(v);

}

}


$("imageFile")
.onchange =
updateProductPreview;


$("productVideoFile")
.onchange =
updateProductPreview;



/* ================= CATEGORY ================= */


$("categorySelect")
.onchange =
event=>{

if(event.target.value){

$("productCategory")
.value =
event.target.value;

}

};


function updateCategories(){

const list =
[...categories].sort();


$("categorySelect")
.innerHTML =
`
<option value="">
-- เลือกหมวดหมู่ --
</option>
`
+
list
.map(
x=>
`<option>${escapeHtml(x)}</option>`
)
.join("");


$("categoryList")
.innerHTML =
list
.map(
x=>
`<option value="${escapeHtml(x)}">`
)
.join("");

}



/* ================= ADD PRODUCT ================= */


$("addProductBtn")
.onclick =
async()=>{

try{

const title =
$("productTitle")
.value
.trim();


const category =
$("productCategory")
.value
.trim();


const price =
Number(
$("productPrice")
.value
);


if(
!title ||
!category ||
isNaN(price)
){

alert(
"กรุณากรอกชื่อสินค้า ราคา และหมวดหมู่"
);

return;

}


const imageFile =
$("imageFile")
.files[0];


const videoFile =
$("productVideoFile")
.files[0];


const modelFile =
$("modelFile")
.files[0];


const folder =
"products/"
+
Date.now();


let image="";

let video="";

let model="";


if(imageFile){

image =
await uploadFile(
imageFile,
folder+"/images"
);

}else{

image =
$("imageUrl")
.value
.trim();

}


if(videoFile){

video =
await uploadFile(
videoFile,
folder+"/videos"
);

}else{

video =
$("productVideoUrl")
.value
.trim();

}


if(modelFile){

model =
await uploadFile(
modelFile,
folder+"/models"
);

}else{

model =
$("modelUrl")
.value
.trim();

}


await addDoc(
collection(
db,
"products"
),
{

title,

description:
$("productDescription")
.value
.trim(),

category,

price,

image,

video,

model3d:model,

line:
$("lineLink")
.value
.trim(),

facebook:
$("facebookLink")
.value
.trim(),

discord:
$("discordLink")
.value
.trim(),

createdAt:
serverTimestamp()

});


alert(
"เพิ่มสินค้าเรียบร้อยแล้ว"
);


location.reload();


}catch(error){

alert(
"เพิ่มสินค้าไม่สำเร็จ\n"+
error.message
);

}

};



/* ================= LOAD PRODUCTS ================= */


function loadProducts(){

onSnapshot(
collection(db,"products"),
snapshot=>{

products =
snapshot.docs.map(
d=>({
id:d.id,
...d.data()
})
);


categories =
new Set(
products
.map(
p=>p.category
)
.filter(Boolean)
);


updateCategories();

updateProductSelector();

renderProducts();

},
error=>{

$("statusBox").textContent =
"โหลดสินค้าไม่ได้: "
+
error.message;

});

}



/* ================= RENDER PRODUCTS ================= */


function renderProducts(){

const box =
$("productList");


if(!products.length){

box.innerHTML =
`<p class="muted">
ยังไม่มีสินค้า
</p>`;

return;

}


box.innerHTML =
products
.map(
p=>{

let media="";


if(p.image){

media +=
`
<img
src="${escapeHtml(p.image)}"
style="
width:150px;
height:110px;
object-fit:contain;
border-radius:10px;
background:#000;
">
`;

}


if(p.video){

media +=
`
<video
src="${escapeHtml(p.video)}"
controls
style="
width:200px;
max-height:120px;
border-radius:10px;
">
</video>
`;

}


if(p.model3d){

media +=
`
<span class="badge">
มีโมเดล 3D .glb
</span>
`;

}


return `

<div class="item">

<h3>
${escapeHtml(p.title)}
</h3>

<span class="badge">
${escapeHtml(p.category)}
</span>

<span class="badge">
${Number(p.price||0)
.toLocaleString()}
บาท
</span>

<p class="muted">
${escapeHtml(p.description||"")}
</p>

<div class="preview">

${media}

</div>

<div class="actions">

<button
class="btn danger"
onclick="deleteProduct('${p.id}')">

ลบสินค้า

</button>

</div>

</div>

`;

}
)
.join("");

}



/* ================= DELETE PRODUCT ================= */


window.deleteProduct =
async id=>{

if(
!confirm(
"ต้องการลบสินค้านี้หรือไม่?"
)
)return;


try{

await deleteDoc(
doc(
db,
"products",
id
)
);


alert("ลบสินค้าแล้ว");

}catch(error){

alert(error.message);

}

};



/* ================= VIDEO PREVIEW ================= */


$("videoFile").onchange =
()=>{

const file =
$("videoFile")
.files[0];

if(!file)return;

$("videoPreview")
.innerHTML =
`
<video
src="${URL.createObjectURL(file)}"
controls>
</video>
`;

};


$("videoCoverFile").onchange =
()=>{

const file =
$("videoCoverFile")
.files[0];

if(!file)return;

$("videoPreview")
.innerHTML +=
`
<img
src="${URL.createObjectURL(file)}">
`;

};



/* ================= PRODUCT SELECTOR ================= */


function updateProductSelector(){

$("videoProduct").innerHTML =
`
<option value="">
-- ไม่ผูกสินค้า --
</option>
`
+
products
.map(
p=>
`
<option value="${p.id}">
${escapeHtml(p.title)}
—
${Number(p.price||0).toLocaleString()}
บาท
</option>
`
)
.join("");

}


$("videoProduct").onchange =
()=>{

const product =
products.find(
p=>
p.id ===
$("videoProduct").value
);


if(product){

$("videoPrice").value =
product.price || 0;

}

};



/* ================= ADD VIDEO ================= */


$("addVideoBtn")
.onclick =
async()=>{

try{

const title =
$("videoTitle")
.value
.trim();


const category =
$("videoCategory")
.value;


if(!title){

alert(
"กรุณาใส่ชื่อคลิป"
);

return;

}


let collectionName;


if(
category ===
"สื่อการสอน"
){

collectionName =
"videos";

}
else if(
category ===
"คลิปโปรโมทสินค้า"
){

collectionName =
"productVideos";

}
else{

collectionName =
"generalVideos";

}


const videoFile =
$("videoFile")
.files[0];


const coverFile =
$("videoCoverFile")
.files[0];


let videoUrl="";

let coverUrl="";


if(videoFile){

videoUrl =
await uploadFile(
videoFile,
"videos"
);

}else{

videoUrl =
$("videoUrl")
.value
.trim();

}


if(coverFile){

coverUrl =
await uploadFile(
coverFile,
"video-covers"
);

}else{

coverUrl =
$("videoCoverUrl")
.value
.trim();

}


if(!videoUrl){

alert(
"กรุณาเลือกวิดีโอหรือใส่ URL"
);

return;

}


const product =
products.find(
p=>
p.id ===
$("videoProduct").value
);


await addDoc(
collection(
db,
collectionName
),
{

title,

description:
$("videoDescription")
.value
.trim(),

category,

url:videoUrl,

cover:coverUrl,

productId:
product?.id || "",

productTitle:
product?.title || "",

productPrice:
Number(
$("videoPrice").value
||
product?.price
||
0
),

createdAt:

});

);

/* ================= LOAD VIDEOS ================= */


function loadVideos(){

[
"productVideos",
"videos",
"generalVideos"
]
.forEach(
collectionName=>{

onSnapshot(
collection(
db,
collectionName
),
snapshot=>{

videos[collectionName] =
snapshot.docs.map(
d=>({

id:d.id,

source:
collectionName,

...d.data()

})
);

renderVideos();

error=>{

console.log(
collectionName,
error.message
);

});

});

}



/* ================= RENDER VIDEOS ================= */


function renderVideos(){

const all =
[
...videos.productVideos,
...videos.videos,
...videos.generalVideos
];


if(!all.length){

$("videoList").innerHTML =
`
<p class="muted">
ยังไม่มีคลิป
</p>
`;

return;

}


$("videoList").innerHTML =
all
.map(
v=>
`

<div class="item">

<h3>
${escapeHtml(v.title)}
</h3>

<span class="badge">
${escapeHtml(v.category)}
</span>

${
v.productTitle
?
`
<span class="badge">
สินค้า:
${escapeHtml(v.productTitle)}
</span>
`
:""
}

${
v.productPrice
?
`
<span class="badge">
${Number(v.productPrice)
.toLocaleString()}
บาท
</span>
`
:""
}

<p class="muted">
${escapeHtml(v.description||"")}
</p>

${
v.cover
?
`
<img
src="${escapeHtml(v.cover)}"
style="
width:180px;
max-height:110px;
object-fit:contain;
border-radius:10px;
background:#000;
">
`
:""
}

<br><br>

<video
src="${escapeHtml(v.url)}"
controls
style="
width:300px;
max-width:100%;
border-radius:10px;
">
</video>

<div class="actions">

<button
class="btn danger"
onclick="
deleteVideo(
'${v.source}',
'${v.id}'
)">

ลบคลิป

</button>

</div>

</div>

`
)
.join("");

}

/* ================= SECURITY HTML ================= */


function escapeHtml(text){

return String(
text ?? ""
)
.replace(
/[&<>"']/g,
char=>
({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char])
);

}
