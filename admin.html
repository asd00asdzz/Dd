.tabs{

.tab.active{

.panel{

h2{

/* =========================================

const app =

/* =========================================

========================================= */

const $ = id =>
    document.getElementById(id);


function escapeHtml(value = ""){

    return String(value).replace(
        /[&<>"']/g,

        char => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[char])
    );

}


function setStatus(
    message,
    type = ""
){

    const el =
        $("status");

    el.textContent =
        message;

    el.className =
        "status " + type;

}


function firebaseError(error){

    console.error(error);

    if(
        error?.code ===
        "permission-denied"
    ){

        return (
            "Missing or insufficient permissions. " +
            "ตรวจ Firestore Rules และบัญชี Admin"
        );

    }


    if(
        error?.code ===
        "storage/unauthorized"
    ){

        return (
            "Storage ไม่มีสิทธิ์อัปโหลด " +
            "กรุณาตรวจ Storage Rules"
        );

    }


    if(
        error?.code ===
        "storage/bucket-not-found"
    ){

        return (
            "ยังไม่ได้เปิด Firebase Storage"
        );

    }


    return error?.message ||
           String(error);

}


/* =========================================
   FILE UPLOAD
========================================= */

async function uploadFile(
    file,
    folder
){

    if(!file){

        return {
            url:"",
            path:""
        };

    }


    const safeName =
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const path =
        folder +
        "/" +
        Date.now() +
        "_" +
        safeName;


    const storageRef =
        ref(storage,path);


    await uploadBytes(
        storageRef,
        file
    );


    const url =
        await getDownloadURL(
            storageRef
        );


    return {
        url,
        path
    };

}


/* =========================================
   LOGIN
========================================= */

$("loginBtn").onclick =
async () => {

    try{

        $("loginBtn").disabled =

        await signInWithPopup(
            auth,
            googleProvider
        );

    }

    }

    finally{

        $("loginBtn").disabled =
            false;

    }

};


$("logoutBtn").onclick =
async () => {
