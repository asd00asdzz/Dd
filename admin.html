<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin | ROBLOX DEV</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#070a11;
color:white;
}

header{
background:#101521;
border-bottom:1px solid #272f40;
padding:18px;
}

header h1{
max-width:1200px;
margin:auto;
}

.container{
max-width:1200px;
margin:auto;
padding:25px 20px;
}

.panel{
background:#111722;
border:1px solid #272f40;
border-radius:18px;
padding:22px;
margin-bottom:25px;
}

h2{
margin-bottom:18px;
}

label{
display:block;
margin-top:13px;
margin-bottom:6px;
color:#cdd3df;
}

input,
textarea,
select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #30394c;
background:#080b12;
color:white;
outline:none;
}

textarea{
min-height:100px;
resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
border-color:#766cff;
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
cursor:pointer;
font-weight:bold;
color:white;
}

.primary{
background:#766cff;
}

.danger{
background:#e5484d;
}

.success{
background:#20a464;
}

.logout{
background:#30394c;
}

button:hover{
opacity:.85;
}

.form-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.status{
padding:12px;
background:#080b12;
border-radius:10px;
margin-bottom:15px;
color:#aaa;
}

.product{
display:flex;
gap:15px;
padding:15px;
border:1px solid #272f40;
border-radius:14px;
margin-top:12px;
background:#0c1018;
}

.product img{
width:120px;
height:80px;
object-fit:cover;
border-radius:8px;
background:#171d29;
}

.product-info{
flex:1;
}

.product-info h3{
margin-bottom:5px;
}

.product-info p{
color:#9da6b7;
font-size:13px;
margin-bottom:5px;
}

.actions{
display:flex;
align-items:center;
gap:8px;
}

.hidden{
display:none;
}

.login{
max-width:450px;
margin:100px auto;
}

.request{
padding:15px;
border:1px solid #272f40;
border-radius:12px;
margin-top:10px;
background:#0c1018;
}

.request button{
margin-top:10px;
margin-right:5px;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:7px;
font-size:12px;
background:#252044;
color:#aaa3ff;
}

@media(max-width:600px){

.product{
flex-direction:column;
}

.product img{
width:100%;
height:180px;
}

.form-buttons{
flex-direction:column;
}

}

</style>

</head>

<body>


<header>

<h1>
⚙️ ROBLOX DEV ADMIN
</h1>

</header>


<!-- LOGIN -->

<section id="loginBox" class="login panel">

<h2>
🔐 เข้าสู่ระบบหลังบ้าน
</h2>

<p style="color:#aaa;margin-bottom:20px">
เฉพาะผู้ดูแลระบบเท่านั้น
</p>

<button
id="googleLogin"
class="primary"
style="width:100%">

เข้าสู่ระบบด้วย Google

</button>

</section>


<!-- ADMIN -->

<main id="adminBox"
class="container hidden">


<div class="panel">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
">

<h2>
📦 เพิ่มสินค้า
</h2>

<button
id="logout"
class="logout">

ออกจากระบบ

</button>

</div>


<div id="status"
class="status">

กำลังโหลด...

</div>


<label>
ชื่อสินค้า
</label>

<input
id="title"
placeholder="เช่น Roblox Police Car">


<label>
รายละเอียดสินค้า
</label>

<textarea
id="description"
placeholder="รายละเอียดของสินค้า"></textarea>


<label>
หมวดหมู่
</label>

<select id="category">

<option value="Model">
Model
</option>

<option value="Script">
Script
</option>

<option value="UI">
UI
</option>

<option value="System">
System
</option>

<option value="3D Model">
3D Model
</option>

<option value="อื่นๆ">
อื่นๆ
</option>

</select>


<label>
ราคา
</label>

<input
id="price"
type="number"
placeholder="500">


<label>
ลิงก์รูปสินค้า
</label>

<input
id="image"
placeholder="https://.../image.jpg">


<h3 style="margin-top:25px">
💬 ช่องทางติดต่อสำหรับสินค้านี้
</h3>


<label>
LINE
</label>

<input
id="line"
placeholder="https://line.me/...">


<label>
Facebook
</label>

<input
id="facebook"
placeholder="https://facebook.com/...">


<label>
Discord
</label>

<input
id="discord"
placeholder="https://discord.gg/...">


<h3 style="margin-top:25px">
🧊 โมเดล 3D
</h3>


<label>
ลิงก์ไฟล์โมเดล 3D (.glb)
</label>

<input
id="model3d"
placeholder="https://.../model.glb">


<p style="
color:#888;
font-size:13px;
margin-top:8px;
line-height:1.5;
">

รองรับโมเดลสำหรับ Web Viewer เช่น .glb
ผู้ชมสามารถหมุน ซูม และเปลี่ยนมุมมองได้

</p>


<div class="form-buttons">

<button
id="addProduct"
class="primary">

➕ เพิ่มสินค้า

</button>

<button
id="clearForm"
class="logout">

ล้างข้อมูล

</button>

</div>

</div>


<!-- สินค้า -->

<div class="panel">

<h2>
🛍️ สินค้าทั้งหมด
</h2>

<div id="productList">

กำลังโหลด...

</div>

</div>


<!-- คำขอเข้าเรียน -->

<div class="panel">

<h2>
📚 คำขอเข้าสื่อการสอน
</h2>

<div id="requestList">

กำลังโหลด...

</div>

</div>


</main>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot,
serverTimestamp,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
firebaseConfig,
ADMIN_EMAIL
}
from "./firebase-config.js";


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const provider=new GoogleAuthProvider();


const loginBox=document.getElementById("loginBox");

const adminBox=document.getElementById("adminBox");

const statusBox=document.getElementById("status");


/* LOGIN */

document
.getElementById("googleLogin")
.addEventListener("click",async()=>{

try{

await signInWithPopup(auth,provider);

}catch(error){

alert(
"เข้าสู่ระบบไม่สำเร็จ\n"+
error.message
);

}

});


/* AUTH */

onAuthStateChanged(auth,user=>{

if(!user){

loginBox.classList.remove("hidden");

adminBox.classList.add("hidden");

return;

}


if(
(user.email||"").toLowerCase()
!==(ADMIN_EMAIL||"").toLowerCase()
){

alert(
"บัญชีนี้ไม่มีสิทธิ์เข้าหลังบ้าน"
);

signOut(auth);

return;

}


loginBox.classList.add("hidden");

adminBox.classList.remove("hidden");

statusBox.innerHTML=
"เข้าสู่ระบบเป็น: <b>"+
(user.email||"")+
"</b>";

loadProducts();

loadRequests();

});


/* LOGOUT */

document
.getElementById("logout")
.addEventListener("click",()=>{

signOut(auth);

});


/* เพิ่มสินค้า */

document
.getElementById("addProduct")
.addEventListener("click",async()=>{

const title=
document.getElementById("title").value.trim();

const description=
document.getElementById("description").value.trim();

const category=
document.getElementById("category").value;

const price=
document.getElementById("price").value.trim();

const image=
document.getElementById("image").value.trim();

const line=
document.getElementById("line").value.trim();

const facebook=
document.getElementById("facebook").value.trim();

const discord=
document.getElementById("discord").value.trim();

const model3d=
document.getElementById("model3d").value.trim();


if(!title){

alert("กรุณาใส่ชื่อสินค้า");

return;

}


try{

await addDoc(
collection(db,"products"),
{

title,
description,
category,
price,
image,
line,
facebook,
discord,
model3d,

createdAt:serverTimestamp()

}
);


alert("เพิ่มสินค้าเรียบร้อย");

clearForm();

}catch(error){

console.error(error);

alert(
"เพิ่มสินค้าไม่สำเร็จ\n"+
error.message
);

}

});


/* ล้าง */

function clearForm(){

[
"title",
"description",
"price",
"image",
"line",
"facebook",
"discord",
"model3d"
].forEach(id=>{

document.getElementById(id).value="";

});

document.getElementById("category").value="Model";

}


document
.getElementById("clearForm")
.addEventListener("click",clearForm);


/* โหลดสินค้า */

function loadProducts(){

onSnapshot(
collection(db,"products"),
snapshot=>{

const box=
document.getElementById("productList");

if(snapshot.empty){

box.innerHTML=
"<p style='color:#888'>ยังไม่มีสินค้า</p>";

return;

}


box.innerHTML=
snapshot.docs.map(item=>{

const x=item.data();

return `

<div class="product">

${
x.image
?
`<img src="${esc(x.image)}">`
:
`<img src="">`
}

<div class="product-info">

<h3>
${esc(x.title||"สินค้า")}
</h3>

<p>
${esc(x.description||"")}
</p>

<p>
หมวดหมู่:
${esc(x.category||"สินค้า")}
</p>

<p>
ราคา:
<b>฿${esc(x.price||0)}</b>
</p>

${
x.model3d
?
`<span class="badge">🧊 มี 3D</span>`
:
""
}

</div>

<div class="actions">

<button
class="danger"
onclick="deleteProduct('${item.id}')">

ลบ

</button>

</div>

</div>

`;

}).join("");

});

}


/* ลบสินค้า */

window.deleteProduct=async function(id){

if(!confirm("ต้องการลบสินค้านี้หรือไม่?")){

return;

}

try{

await deleteDoc(
doc(db,"products",id)
);

}catch(error){

alert(
"ลบไม่สำเร็จ\n"+
error.message
);

}

};


/* คำขอ */

function loadRequests(){

onSnapshot(
collection(db,"accessRequests"),
snapshot=>{

const box=
document.getElementById("requestList");


const docs=snapshot.docs.filter(item=>{

const x=item.data();

return x.uid;

});


if(!docs.length){

box.innerHTML=
"<p style='color:#888'>ยังไม่มีคำขอ</p>";

return;

}


box.innerHTML=
docs.map(item=>{

const x=item.data();

const status=x.status||"pending";

return `

<div class="request">

<b>
${esc(x.displayName||"ไม่ระบุชื่อ")}
</b>

<p style="color:#aaa;margin-top:5px">

${esc(x.email||"ไม่ระบุอีเมล")}

</p>

<p style="margin-top:8px">

สถานะ:
<span class="badge">

${esc(status)}

</span>

</p>

${
status==="pending"
?
`

<button
class="success"
onclick="approveUser('${item.id}')">

✅ อนุมัติ

</button>

<button
class="danger"
onclick="denyUser('${item.id}')">

❌ ปฏิเสธ

</button>

`
:
""

}

</div>

`;

}).join("");

});

}


/* อนุมัติ */

window.approveUser=async function(id){

try{

await updateDoc(
doc(db,"accessRequests",id),
{

status:"approved",
updatedAt:serverTimestamp()

}
);

}catch(error){

alert(
"อนุมัติไม่สำเร็จ\n"+
error.message
);

}

};


/* ปฏิเสธ */

window.denyUser=async function(id){

try{

await updateDoc(
doc(db,"accessRequests",id),
{

status:"denied",
updatedAt:serverTimestamp()

}
);

}catch(error){

alert(
"ปฏิเสธไม่สำเร็จ\n"+
error.message
);

}

};


/* ป้องกัน HTML */

function esc(x){

return String(x ?? "")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}

</script>

</body>
</html>
